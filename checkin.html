<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>เช็คชื่อเข้าเรียน · /sorasukt Classroom</title>
  <link rel="icon" type="image/png" sizes="64x64" href="https://sorasukt.com/classroom/assets/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://sorasukt.com/classroom/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Kanit:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#141312;
      --ink-soft:#6d6a64;
      --paper:#fff;
      --surface:#f4f3f0;
      --line:#e6e4df;
      --line-strong:#d3d0c9;
      --red:#ff3b30;
      --red-soft:#fff0ee;
      --red-dim:#ffd6d2;
      --green:#18a63b;
      --green-soft:#eafaef;
      --radius-card:28px;
      --radius-field:16px;
      --radius-btn:16px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{
      display:grid;place-items:center;
      padding:clamp(16px,6vh,56px) clamp(16px,8vw,96px);
      background:
        radial-gradient(circle at 15% 8%, rgba(255,59,48,0.05), transparent 42%),
        radial-gradient(circle at 88% 92%, rgba(0,0,0,0.035), transparent 45%),
        var(--surface);
      color:var(--ink);
      font-family:"IBM Plex Sans Thai",sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    main{display:grid;place-items:center;width:100%;height:100%}

    .card{
      position:relative;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      width:min(960px,100%);height:min(620px,100%);
      padding:46px clamp(28px,5vw,68px);
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:var(--radius-card);
      background:var(--paper);
      box-shadow:
        0 1px 0 rgba(255,255,255,.6) inset,
        0 40px 90px -56px rgba(20,19,18,.35),
        0 10px 30px -20px rgba(20,19,18,.15);
      text-align:center;
    }
    .card::before{
      content:"";
      position:absolute; top:0; left:50%; transform:translateX(-50%);
      width:56px; height:4px; border-radius:0 0 6px 6px;
      background:var(--red);
    }

    .logo-frame{
      display:flex;
      align-items:center;
      justify-content:center;
      width:96px;
      height:96px;
      margin:0 0 22px;
    }
    .logo{display:block;width:64px;height:64px;object-fit:contain}

    header{display:flex; flex-direction:column; align-items:center;}
    .eyebrow{
      font:600 11.5px/1 "IBM Plex Sans Thai",sans-serif;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:var(--ink-soft);
      margin:0 0 10px;
    }
    .eyebrow::before{content:"";display:inline-block;width:6px;height:6px;background:var(--red);border-radius:1px;margin-right:8px;vertical-align:middle;}
    h1{margin:0;font:600 clamp(29px,2.4vw,38px)/1.18 Kanit;letter-spacing:-.02em}
    header>p{max-width:700px;margin:12px auto 0;color:var(--ink-soft);font-size:clamp(17px,1.4vw,21px);line-height:1.5}
    .error{color:var(--red)!important}
    .success-tone{color:var(--green)!important}

    .checkin-content{width:100%}
    .form-area{width:min(500px,100%);margin:34px auto 0}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

    input,.code-preview,.subject-box{
      display:flex;align-items:center;justify-content:center;
      width:100%;height:92px;padding:10px 24px;
      border:1.5px solid var(--line);
      border-radius:var(--radius-field);
      background:#fdfdfc;
      color:var(--ink);
      text-align:center;
      box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 2px 8px -6px rgba(20,19,18,.15) inset;
      transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .code-input{
      font:600 clamp(40px,3.8vw,54px)/1 Kanit;
      letter-spacing:.45em;
      padding-left:calc(24px + .45em);
      color:var(--ink);
    }
    .student-code,.code-preview,.subject-box{font:600 clamp(22px,1.8vw,28px)/1.2 Kanit}
    .student-code::placeholder{color:#a7a49d;opacity:1;font-weight:500;letter-spacing:0}
    input:focus{
      border-color:var(--red);
      outline:0;
      background:#fff;
      box-shadow:0 0 0 4px var(--red-soft);
    }
    .code-preview,.subject-box{
      background:var(--surface);
      border-style:dashed;
      color:var(--ink);
    }

    button,.home-link{
      display:flex;align-items:center;justify-content:center;
      width:220px;height:56px;margin:22px auto 0;
      border:0;border-radius:var(--radius-btn);
      background:var(--ink);color:#fff;
      font:600 clamp(20px,1.5vw,24px)/1 Kanit;
      cursor:pointer;text-decoration:none;
      box-shadow:0 14px 28px -18px rgba(20,19,18,.55);
      transition:transform .12s ease, opacity .12s ease, box-shadow .12s ease;
    }
    button:hover,.home-link:hover{opacity:.9; transform:translateY(-1px); box-shadow:0 18px 34px -18px rgba(20,19,18,.6);}
    button:active,.home-link:active{transform:scale(.98) translateY(0); box-shadow:0 8px 16px -12px rgba(20,19,18,.5);}
    button.danger{background:var(--red); box-shadow:0 14px 28px -18px rgba(255,59,48,.55);}
    button.danger:hover{box-shadow:0 18px 34px -18px rgba(255,59,48,.6);}
    button:disabled{opacity:.55;cursor:wait; transform:none;}

    .confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(456px,100%);margin:22px auto 0}
    .confirm-actions button{width:100%;margin:0}

    .subject-box{margin-top:0}
    #message{min-height:0;margin:14px 0 0;color:var(--red);font-size:14px;font-weight:500}

    @media(max-height:680px){
      body{padding-block:12px}
      .card{height:100%;padding-block:24px}
      .logo-frame{width:76px;height:76px;margin-bottom:12px}
      .logo{width:52px;height:52px}
      .form-area{margin-top:22px}
      input,.code-preview,.subject-box{height:76px}
      button,.home-link{height:50px;margin-top:14px}
      .confirm-actions{margin-top:14px}
    }
    @media(max-width:700px){
      body{padding:10px}
      .card{width:100%;height:min(580px,100%);padding:28px 20px;border-radius:22px}
      .logo-frame{width:80px;height:80px;margin-bottom:16px}
      .logo{width:54px;height:54px}
      h1{font-size:clamp(27px,8vw,34px)}
      header>p{margin-top:9px;font-size:clamp(16px,4.7vw,19px)}
      .form-area{width:min(420px,100%);margin-top:28px}
      input,.code-preview,.subject-box{height:78px;border-radius:14px;padding-inline:14px}
      .code-input{font-size:clamp(36px,11vw,48px);letter-spacing:.3em;padding-left:calc(14px + .3em)}
      .student-code,.code-preview,.subject-box{font-size:clamp(21px,6vw,26px)}
      button,.home-link{width:min(220px,76%);height:52px;margin-top:18px;border-radius:16px;font-size:21px}
      .confirm-actions{gap:9px;margin-top:18px}
      .confirm-actions button{width:100%}
    }
    @media(max-width:700px) and (max-height:540px){
      .card{padding-block:16px}
      .logo-frame{width:60px;height:60px;margin-bottom:8px}
      .logo{width:42px;height:42px}
      .form-area{margin-top:14px}
      header>p{margin-top:5px}
      input,.code-preview,.subject-box{height:62px}
      button,.home-link{height:44px;margin-top:9px}
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <div class="logo-frame">
        <img class="logo" src="https://sorasukt.com/classroom/assets/classroom-logo.png" alt="โลโก้ Classroom by /sorasukt">
      </div>
      <header>
        <p class="eyebrow">/sorasukt Classroom</p>
        <h1 id="pageTitle">เช็คชื่อเข้าเรียน</h1>
        <p id="pageSubtitle"></p>
      </header>
      <div class="checkin-content"><div class="form-area" id="studentFlow"></div><p id="message" role="alert"></p></div>
    </section>
  </main>
  <script id="checkin-bootstrap" type="application/json">%%CHECKIN_BOOTSTRAP%%</script>
  <script>
    (() => {
      const config=JSON.parse(document.getElementById('checkin-bootstrap').textContent);
      const flow=document.getElementById('studentFlow');
      const message=document.getElementById('message');
      const title=document.getElementById('pageTitle');
      const subtitle=document.getElementById('pageSubtitle');
      const escapeText=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      let pendingCode=config.savedStudentCode||'';

      function setHeading(text,detail,tone=''){
        title.textContent=text; title.className=tone;
        subtitle.textContent=detail; subtitle.className=tone;
        document.title=text+' · /sorasukt Classroom';
      }
      function renderCode(){
        const invalid=Boolean(config.message);
        setHeading('เช็คชื่อเข้าเรียน',invalid?config.message:'กรอกรหัสที่แสดงบนหน้าจอของครู',invalid?'error':'');
        flow.innerHTML='<form id="codeForm"><label class="sr-only" for="code">รหัสเช็คชื่อ 5 หลัก</label><input class="code-input" id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{5}" maxlength="5" placeholder="00000" required><button class="'+(invalid?'danger':'')+'">'+(invalid?'ไม่ถูกต้อง':'ตกลง')+'</button></form>';
        document.getElementById('codeForm').onsubmit=event=>{event.preventDefault();const code=document.getElementById('code').value.trim();if(/^\d{5}$/.test(code))location.href='/checkin?code='+encodeURIComponent(code);else{config.message='กรุณากรอกรหัสตัวเลข 5 หลัก';renderCode()}};
        document.getElementById('code').focus();
      }
      function bindEnter(){document.getElementById('student-code')?.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();beginConfirm()}})}
      function renderEntry(error=''){
        setHeading('เช็คชื่อเข้าเรียน',error||'กรอกรหัสนักเรียนเพื่อเช็คชื่อ',error?'error':'');
        flow.innerHTML='<label class="sr-only" for="student-code">รหัสนักเรียน</label><input class="student-code" id="student-code" autocomplete="off" inputmode="text" placeholder="รหัสนักเรียน"><button id="start-checkin">เช็คชื่อ</button>';
        document.getElementById('start-checkin').onclick=beginConfirm; bindEnter(); document.getElementById('student-code').focus();
      }
      function beginConfirm(){
        const input=document.getElementById('student-code');
        pendingCode=(input?.value||pendingCode).trim();
        if(!pendingCode){renderEntry('กรุณากรอกรหัสนักเรียน');return}
        renderConfirm();
      }
      function renderConfirm(){
        setHeading('เช็คชื่อเข้าเรียน','ตรวจสอบรหัสนักเรียนเพื่อเช็คชื่อ');
        flow.innerHTML='<div class="student-code code-preview">'+escapeText(pendingCode)+'</div><div class="confirm-actions"><button class="danger" id="change-code">กรอกใหม่</button><button id="confirm-checkin">เช็คชื่อ</button></div>';
        document.getElementById('change-code').onclick=changeCode;
        document.getElementById('confirm-checkin').onclick=submitCheckin;
      }
      async function changeCode(){
        if(!config.savedStudentId){renderEntry();return}
        setHeading('เช็คชื่อเข้าเรียน','กำลังตรวจสอบสิทธิ์เปลี่ยนรหัส...');
        try{
          const response=await fetch('/api/checkin/reset-device',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:config.token})});
          const data=await response.json();
          if(!response.ok){renderLocked(data.error||'ยังไม่สามารถเปลี่ยนรหัสนักเรียนได้');return}
          if(data.reset)location.reload();else renderEntry();
        }catch(error){renderLocked(error.message)}
      }
      function renderLocked(detail){
        setHeading('เช็คชื่อเข้าเรียน',detail,'error');
        flow.innerHTML='<div class="student-code code-preview">'+escapeText(pendingCode)+'</div><button id="locked-checkin">เช็คชื่อ</button>';
        document.getElementById('locked-checkin').onclick=submitCheckin;
      }
      function renderInvalid(detail){
        setHeading('เช็คชื่อเข้าเรียน',detail||'รหัสไม่ถูกต้อง โปรดตรวจสอบและแก้ไขใหม่อีกครั้ง','error');
        flow.innerHTML='<div class="student-code code-preview">'+escapeText(pendingCode)+'</div><button class="danger" id="invalid-code">ไม่ถูกต้อง</button>';
        document.getElementById('invalid-code').onclick=()=>renderEntry();
      }
      async function submitCheckin(){
        const button=document.getElementById('confirm-checkin')||document.getElementById('locked-checkin');
        if(button){button.disabled=true;button.textContent='กำลังเช็คชื่อ...'}
        try{
          const response=await fetch('/api/checkin/claim',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:config.token,student_id:config.savedStudentId||0,student_code:pendingCode})});
          const data=await response.json();
          if(!response.ok){renderInvalid(data.error);return}
          setHeading('เช็คชื่อเข้าเรียนสำเร็จ',data.student.name+' ได้เช็คชื่อสำเร็จ','success-tone');
          flow.innerHTML='<div class="subject-box">'+escapeText(data.classroom||config.classroomName)+'</div>';
        }catch(error){renderInvalid(error.message)}
      }
      function renderContent(){
        setHeading(config.title||'เกิดข้อผิดพลาด',config.subtitle||'',config.tone||'');
        flow.innerHTML=config.content||'';
      }

      if(config.mode==='code')renderCode();
      else if(config.mode==='student'){if(config.savedStudentId)renderConfirm();else renderEntry()}
      else renderContent();
    })();
  </script>
</body>
</html>
