<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f3">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>เช็คชื่อเข้าเรียน · /sorasukt Classroom</title>
  <link rel="icon" type="image/png" sizes="64x64" href="https://sorasukt.com/classroom/assets/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://sorasukt.com/classroom/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Kanit:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Match the teacher workspace; kept inline for Worker-rendered check-in routes. */
    :root{--ink:#161514;--ink-soft:#686966;--paper:#fff;--surface:#f5f6f3;--line:#e5e6e2;--red:#ba342c;--red-soft:#fff0ee;--green:#176326;--green-soft:#f0faf2}
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--surface)}
    body{margin:0;min-height:100dvh;display:flex;flex-direction:column;color:var(--ink);font-family:"IBM Plex Sans Thai",sans-serif;-webkit-font-smoothing:antialiased}
    .site-header{display:flex;align-items:center;min-height:80px;padding:18px clamp(20px,4vw,64px);background:var(--paper);border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:10px;font:600 18px/1.35 Kanit,sans-serif}
    .brand small{display:block;color:var(--ink-soft);font:400 11px "IBM Plex Sans Thai",sans-serif}
    .logo{display:block;width:34px;height:34px;object-fit:contain}
    main{display:grid;place-items:center;flex:1;width:100%;padding:48px 20px}
    .card{width:min(520px,100%);padding:36px;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 2px 5px #16151402}
    .eyebrow{margin:0 0 8px;color:var(--red);font-size:12px;font-weight:600}
    h1{margin:0;font:600 clamp(25px,3vw,32px)/1.35 Kanit,sans-serif;overflow-wrap:anywhere}
    .card header>p:last-child{margin:10px 0 0;color:var(--ink-soft);font-size:14px;line-height:1.75;overflow-wrap:anywhere}
    .error{color:var(--red)!important}
    .success-tone{color:var(--green)!important}
    .checkin-content{width:100%;min-width:0}
    .form-area{width:100%;margin:28px 0 0}
    .field-label{display:block;margin:0 0 8px;color:var(--ink-soft);font-size:12.5px;font-weight:600}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    input,.code-preview,.subject-box{width:100%;min-width:0;min-height:56px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:500 20px/1.5 "IBM Plex Sans Thai",sans-serif;transition:border-color .15s,background .15s}
    .code-input{min-height:76px;text-align:center;font:600 clamp(28px,8vw,36px)/1.4 Kanit,sans-serif;letter-spacing:.3em;padding-left:calc(16px + .3em);font-variant-numeric:tabular-nums}
    input::placeholder{color:#90938b;opacity:1}
    input:focus{outline:0;border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
    .code-preview,.subject-box{background:var(--surface);overflow-wrap:anywhere;white-space:normal}
    .code-preview{font-variant-numeric:tabular-nums}
    .subject-box{font-size:16px}
    button,.home-link{display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;margin:20px 0 0;padding:12px 16px;border:1px solid var(--ink);border-radius:10px;background:var(--ink);color:#fff;font:500 14px/1.5 "IBM Plex Sans Thai",sans-serif;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s;text-align:center}
    button:hover,.home-link:hover{background:#353531}
    button.secondary{background:var(--paper);color:var(--ink);border-color:var(--line)}
    button.secondary:hover{background:#f0f1ed;border-color:#c7c9c1}
    button.danger{background:var(--red);border-color:var(--red)}
    button.danger:hover{background:#952820}
    button:focus-visible,.home-link:focus-visible{outline:3px solid var(--red);outline-offset:3px}
    button:disabled{opacity:.55;cursor:wait}
    .confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
    .confirm-actions button{margin:0}
    #message{margin:14px 0 0;color:var(--red);font-size:13px;line-height:1.7;overflow-wrap:anywhere}
    #message:empty{display:none}
    .site-footer{padding:0 20px calc(24px + env(safe-area-inset-bottom));text-align:center;color:var(--ink-soft);font-size:11px}
    @media(max-width:560px){.site-header{min-height:68px;padding:16px 20px}main{padding:28px 14px;align-items:start}.card{padding:26px 22px}.form-area{margin-top:24px}}
    @media(max-height:540px){main{padding-block:20px;align-items:start}.card{padding:24px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="brand"><img class="logo" src="https://sorasukt.com/classroom/assets/classroom-logo.png" alt="โลโก้ Classroom"><span>Classroom<small>by /sorasukt</small></span></div>
  </header>
  <main>
    <section class="card" aria-labelledby="pageTitle">
      <header>
        <p class="eyebrow">สำหรับนักเรียน</p>
        <h1 id="pageTitle">เช็คชื่อเข้าเรียน</h1>
        <p id="pageSubtitle"></p>
      </header>
      <div class="checkin-content"><div class="form-area" id="studentFlow"></div><p id="message" role="alert"></p></div>
    </section>
  </main>
  <footer class="site-footer">Classroom by /sorasukt · ระบบเช็คชื่อเข้าเรียน</footer>
  <script id="checkin-bootstrap" type="application/json">%%CHECKIN_BOOTSTRAP%%</script>
  <script>
    (() => {
      const config=JSON.parse(document.getElementById('checkin-bootstrap').textContent);
      const flow=document.getElementById('studentFlow');
      const message=document.getElementById('message');
      const title=document.getElementById('pageTitle');
      const subtitle=document.getElementById('pageSubtitle');
      const escapeText=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      let pendingCode=config.savedStudentCode||'';

      function setHeading(text,detail,tone=''){
        title.textContent=text; title.className=tone;
        subtitle.textContent=detail; subtitle.className=tone;
        document.title=text+' · /sorasukt Classroom';
      }
      function renderCode(){
        const invalid=Boolean(config.message);
        setHeading('เช็คชื่อเข้าเรียน',invalid?config.message:'กรอกรหัสที่แสดงบนหน้าจอของครู',invalid?'error':'');
        flow.innerHTML='<form id="codeForm"><label class="field-label" for="code">รหัสเช็คชื่อ 5 หลัก</label><input class="code-input" id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{5}" maxlength="5" placeholder="00000" required><button class="'+(invalid?'danger':'')+'">'+(invalid?'ลองอีกครั้ง':'ดำเนินการต่อ')+'</button></form>';
        document.getElementById('codeForm').onsubmit=event=>{event.preventDefault();const code=document.getElementById('code').value.trim();if(/^\d{5}$/.test(code))location.href='/checkin?code='+encodeURIComponent(code);else{config.message='กรุณากรอกรหัสตัวเลข 5 หลัก';renderCode()}};
        document.getElementById('code').focus();
      }
      function bindEnter(){document.getElementById('student-code')?.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();beginConfirm()}})}
      function renderEntry(error=''){
        setHeading('เช็คชื่อเข้าเรียน',error||'กรอกรหัสนักเรียนเพื่อเช็คชื่อ',error?'error':'');
        flow.innerHTML='<label class="field-label" for="student-code">รหัสนักเรียน</label><input class="student-code" id="student-code" autocomplete="off" inputmode="text" placeholder="รหัสนักเรียน"><button id="start-checkin">เช็คชื่อ</button>';
        document.getElementById('start-checkin').onclick=beginConfirm; bindEnter(); document.getElementById('student-code').focus();
      }
      function beginConfirm(){
        const input=document.getElementById('student-code');
        pendingCode=(input?.value||pendingCode).trim();
        if(!pendingCode){renderEntry('กรุณากรอกรหัสนักเรียน');return}
        renderConfirm();
      }
      function renderConfirm(){
        setHeading('เช็คชื่อเข้าเรียน','ตรวจสอบรหัสนักเรียนเพื่อเช็คชื่อ');
        flow.innerHTML='<p class="field-label">รหัสนักเรียน</p><div class="student-code code-preview">'+escapeText(pendingCode)+'</div><div class="confirm-actions"><button class="secondary" id="change-code">กรอกใหม่</button><button id="confirm-checkin">เช็คชื่อ</button></div>';
        document.getElementById('change-code').onclick=changeCode;
        document.getElementById('confirm-checkin').onclick=submitCheckin;
      }
      async function changeCode(){
        if(!config.savedStudentId){renderEntry();return}
        setHeading('เช็คชื่อเข้าเรียน','กำลังตรวจสอบสิทธิ์เปลี่ยนรหัส...');
        try{
          const response=await fetch('/api/checkin/reset-device',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:config.token})});
          const data=await response.json();
          if(!response.ok){renderLocked(data.error||'ยังไม่สามารถเปลี่ยนรหัสนักเรียนได้');return}
          if(data.reset)location.reload();else renderEntry();
        }catch(error){renderLocked(error.message)}
      }
      function renderLocked(detail){
        setHeading('เช็คชื่อเข้าเรียน',detail,'error');
        flow.innerHTML='<p class="field-label">รหัสนักเรียน</p><div class="student-code code-preview">'+escapeText(pendingCode)+'</div><button id="locked-checkin">เช็คชื่อ</button>';
        document.getElementById('locked-checkin').onclick=submitCheckin;
      }
      function renderInvalid(detail){
        setHeading('เช็คชื่อเข้าเรียน',detail||'รหัสไม่ถูกต้อง โปรดตรวจสอบและแก้ไขใหม่อีกครั้ง','error');
        flow.innerHTML='<p class="field-label">รหัสนักเรียน</p><div class="student-code code-preview">'+escapeText(pendingCode)+'</div><button class="danger" id="invalid-code">แก้ไขรหัสนักเรียน</button>';
        document.getElementById('invalid-code').onclick=()=>renderEntry();
      }
      async function submitCheckin(){
        const button=document.getElementById('confirm-checkin')||document.getElementById('locked-checkin');
        if(button){button.disabled=true;button.textContent='กำลังเช็คชื่อ...'}
        try{
          const response=await fetch('/api/checkin/claim',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:config.token,student_id:config.savedStudentId||0,student_code:pendingCode})});
          const data=await response.json();
          if(!response.ok){renderInvalid(data.error);return}
          setHeading('เช็คชื่อเข้าเรียนสำเร็จ',data.student.name+' ได้เช็คชื่อสำเร็จ','success-tone');
          flow.innerHTML='<p class="field-label">ห้องเรียน</p><div class="subject-box">'+escapeText(data.classroom||config.classroomName)+'</div>';
        }catch(error){renderInvalid(error.message)}
      }
      function renderContent(){
        setHeading(config.title||'เกิดข้อผิดพลาด',config.subtitle||'',config.tone||'');
        flow.innerHTML=config.content||'';
      }

      if(config.mode==='code')renderCode();
      else if(config.mode==='student'){if(config.savedStudentId)renderConfirm();else renderEntry()}
      else renderContent();
    })();
  </script>
</body>
</html>
