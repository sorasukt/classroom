name: Deploy to Cloudflare

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Worker syntax
        run: node --input-type=module --check < worker.js

      - name: Check required deployment configuration
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$AUTH0_CLIENT_SECRET"
          test -n "$SESSION_SECRET"
          test -n "$D1_DATABASE_ID"
          test -n "$AUTH0_CLIENT_ID"

  deploy:
    name: Deploy Worker
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply public configuration
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
        run: |
          sed -i "s|REPLACE_WITH_D1_DATABASE_ID|$D1_DATABASE_ID|g" wrangler.toml
          sed -i "s|REPLACE_WITH_AUTH0_CLIENT_ID|$AUTH0_CLIENT_ID|g" wrangler.toml

      - name: Upload secrets and deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.81.0"
          secrets: |
            AUTH0_CLIENT_SECRET
            SESSION_SECRET
        env:
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      - name: Add deployment summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "## Cloudflare deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment completed: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"

