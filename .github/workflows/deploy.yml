name: Deploy to Cloudflare

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Worker syntax
        run: node --input-type=module --check < worker.js

      - name: Check migration and Wrangler configuration
        run: |
          test -s migrations/0001_initial.sql
          test -s migrations/0002_tenant_admin_import.sql
          cp wrangler.toml wrangler.validation.toml
          sed -i "s|REPLACE_WITH_D1_DATABASE_ID|00000000-0000-0000-0000-000000000000|g" wrangler.validation.toml
          sed -i "s|REPLACE_WITH_AUTH0_CLIENT_ID|ci-auth0-client-id|g" wrangler.validation.toml
          npx wrangler@4.81.0 deploy --dry-run --config wrangler.validation.toml

  deploy:
    name: Deploy Worker
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Apply production Wrangler configuration
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
        run: |
          test -n "$D1_DATABASE_ID"
          test -n "$AUTH0_CLIENT_ID"
          sed -i "s|REPLACE_WITH_D1_DATABASE_ID|$D1_DATABASE_ID|g" wrangler.toml
          sed -i "s|REPLACE_WITH_AUTH0_CLIENT_ID|$AUTH0_CLIENT_ID|g" wrangler.toml

      - name: Verify D1 and provision R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4.81.0 d1 info DB --config wrangler.toml
          if ! npx wrangler@4.81.0 r2 bucket info classroom-exports --config wrangler.toml; then
            npx wrangler@4.81.0 r2 bucket create classroom-exports --config wrangler.toml
          fi

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.81.0 d1 migrations apply DB --remote --config wrangler.toml

      - name: Validate production Worker bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.81.0 deploy --dry-run --config wrangler.toml

      - name: Upload Auth0 Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
        run: |
          test -n "$AUTH0_CLIENT_SECRET"
          printf '%s' "$AUTH0_CLIENT_SECRET" | npx wrangler@4.81.0 secret put AUTH0_CLIENT_SECRET --config wrangler.toml

      - name: Deploy Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.81.0 deploy --config wrangler.toml

      - name: Add deployment summary
        run: |
          echo "## Cloudflare deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment completed: https://classroom.sorasukt.com" >> "$GITHUB_STEP_SUMMARY"
