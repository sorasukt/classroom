name = "classroom"
main = "worker.js"
compatibility_date = "2026-08-01"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[triggers]
crons = ["5 17 * * *"]

[[routes]]
pattern = "classroom.sorasukt.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "classroom-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "EXPORTS"
bucket_name = "classroom-exports"

[vars]
APP_NAME = "Classroom by /sorasukt"
AUTH0_DOMAIN = "auth.sorasukt.com"
AUTH0_CLIENT_ID = "REPLACE_WITH_AUTH0_CLIENT_ID"
PUBLIC_URL = "https://classroom.sorasukt.com"
FRONTEND_URL = "https://sorasukt.com/classroom/"
CORS_ORIGINS = "https://sorasukt.com,https://www.sorasukt.com,https://sorasukt.github.io"

[observability]
enabled = true
head_sampling_rate = 1
